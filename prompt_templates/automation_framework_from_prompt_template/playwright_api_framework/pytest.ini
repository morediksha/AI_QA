[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    smoke: Smoke tests
    regression: Regression tests
    sanity: Sanity tests
    critical: Critical tests
    api: API tests
    slow: Slow tests
